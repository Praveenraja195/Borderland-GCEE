<!doctype html>
<html lang="en">

<head>
  <!-- Fix §5.2: preconnect + preload stylesheet replaces the render-blocking
       @import that was inside theme.css. This lets the browser discover
       font URLs in parallel with CSS parsing instead of sequentially. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&family=UnifrakturMaguntia&display=swap">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Borderland-GCEE — Team</title>
  <!-- Installed-app full screen (the in-page Fullscreen API is not available
       on iOS; Add to Home Screen is the route there). -->
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Borderland" />
  <meta name="theme-color" content="#000000" />
  <link rel="apple-touch-icon" href="../shared/img/borderland_logo.png" />
  <link rel="stylesheet" href="../shared/css/theme.css?v=v64_login_hints" />
  <link rel="stylesheet" href="css/team.css?v=v64_login_hints" />
</head>

<body>
  <div id="app" class="app-shell mode-light"></div>
  <script type="module" src="js/main.js?v=v64_login_hints"></script>
</body>

</html>
